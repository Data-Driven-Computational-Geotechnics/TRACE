# fix1 stage A — teacher 预训练 + P1 噪声校正目标 (对照组 = w3a_512, 唯一差异是
# target_correction + vel_from_displacement + val_rollout 200→300)
# P1: 目标加速度从加噪态反推 → 模型学会"把偏离态拉回真值轨迹"而非仅"抗噪"。
model_name: trace
results_dirname: 01-trace
gpu: [1]
seed: 0
results_path: .
dataset_root: datasets/008-Sand-2D
n_val: 16
radius: 0.0036
skin_factor: null
memory: st
hidden_dim: 128
memory_dim: 16
normalize_inputs: true
boundary_features: true
sample_weighting: motion
loss: mse
epochs: 2000
decay_epochs: 300
early_stop_patience: 120
warmup_steps: 100
val_rollout: 300          # 200→300: 选 checkpoint 的尺子覆盖真正的长时段
eval_interval: 20
lr: 3.0e-4
lr_min: 3.0e-06
n_train: 512
num_layers: 8
rollout_steps: 15
noise: 0.0004
target_correction: true   # ★P1★
vel_from_displacement: true   # ★P3★ (验证/推理协议, 与 stage B 一致)
exp_name: main/01-pretrain
