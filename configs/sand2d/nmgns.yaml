# TGNNS baseline (node-level temporal state) — 2D sand-column collapse, dataset 008-Sand
# Run:     python ../../model/03-tgnn/train.py --config tgnn/config/tgnn.yaml
# Outputs: 03-tgnn/results/tgnn_sand2d_node/<timestamp>/{train.log, best_model.pt}  (由 results_dirname 决定)

# ── run ──────────────────────────────────────────────────────────────────────
exp_name: "tgnn_sand2d_node"    # {method}_{benchmark}_{variant} → output folder prefix
model_name: "tgnn"              # which model package (model/03-tgnn); don't change
results_dirname: "03-tgnn"      # 输出落到 03-tgnn/results/(带编号的项目文件夹), 不是默认的 tgnn/
gpu: [2]                        # GPU id(s); [] or null → inherit CUDA_VISIBLE_DEVICES
seed: 0
results_path: "."               # outputs created under here (run.sh cd's into experiment dir)

# ── data ─────────────────────────────────────────────────────────────────────
dataset_root: "datasets/008-Sand-2D"   # train.h5 / valid.h5 / metadata.json
n_train: 512                    # training trajectories (== Trace pretraining pool, fair comparison)
n_val: 16                       # validation trajectories (pick best checkpoint; == Trace)

# ── geometry ─────────────────────────────────────────────────────────────────
radius: 0.0036                  # particle radius (~ half the median nearest-neighbour spacing)
skin_factor: null               # null = auto from dataset connectivity radius

# ── model (node temporal) ────────────────────────────────────────────────────
n_frames: 6                     # position snapshots per forward = TGNNS's temporal window
n_gnn: 2                        # trailing GNN layers on the last frame's graph
hidden_dim: 128                 # latent width

# ── training ─────────────────────────────────────────────────────────────────
epochs: 2000                    # passes over the training set
samples_per_traj: 6             # random time windows accumulated per optimizer step
val_rollout: 100                # rollout length for the validation MSE (checkpoint selection)
lr: 3.0e-4                      # AdamW lr (warmup + cosine decay)
noise: 3.0e-4                   # GNS input-noise std (~ per-step velocity scale)
