# 3D stage B — rollout 微调 (对齐 2D 的 paper-model 配方: P1+P2+P3)
# init_from 由 run_3d.sh 注入 stage A 的 best_model.pt
model_name: trace
results_dirname: 01-trace
gpu: [0, 1, 2, 3]
seed: 0
results_path: .
dataset_root: datasets/009-Sand-3D
n_val: 16
radius: 0.0068
skin_factor: null
memory: st
hidden_dim: 128
memory_dim: 16
num_layers: 8
normalize_inputs: true
boundary_features: true
sample_weighting: motion
loss: mse
train_mode: rollout
init_from: __TEACHER_BEST__
pos_loss_weight: 300.0
epochs: 300
decay_epochs: 80
early_stop_patience: 50
warmup_steps: 50
val_rollout: 300
eval_interval: 20
lr: 5.0e-05
lr_min: 1.0e-06
n_train: 64
rollout_steps: 12
rollout_drift_max: 150
rollout_warmup_epochs: 40
noise: 1.2e-4           # = 0.7x acc_std, 与 2D stage B 比例一致
target_correction: true
constrained_rollout: true
vel_from_displacement: true
grad_checkpoint: true
exp_name: main/02-paper-model
