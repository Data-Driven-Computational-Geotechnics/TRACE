# 3D stage A — P1 噪声校正 teacher 预训练 (对齐 2D 的 pretrain-P1 配方)
# 启动: torchrun --standalone --nproc_per_node=4 (由 run_3d.sh 驱动)
# 前置工程完成(2026-07-05): 稀疏近邻(G1逐位等价) + 梯度检查点(G2: 5.5/10.6GB) + 4卡DDP(G3收敛)
# 等效 batch=4(四卡梯度平均), 相对 2D 配方的已知偏差, 记录在案。
model_name: trace
results_dirname: 01-trace
gpu: [0, 1, 2, 3]
seed: 0
results_path: .
dataset_root: datasets/009-Sand-3D
n_val: 16
radius: 0.0068          # = 3D 最近邻间距中位数 0.01359 / 2 (2026-07-05 实测)
skin_factor: null       # 自动 = 0.025/(2*0.0068) = 1.839
memory: st
hidden_dim: 128
memory_dim: 16
normalize_inputs: true
boundary_features: true
sample_weighting: motion
loss: mse
epochs: 2000
decay_epochs: 300
early_stop_patience: 120
warmup_steps: 100
val_rollout: 300
eval_interval: 20
lr: 3.0e-4
lr_min: 3.0e-06
n_train: 128            # 3D 单场景成本高, 先小规模起步再扩
windows_per_epoch: 4    # 每epoch每轨迹采4窗 → 128步/卡/epoch, 步数货币对齐 2D(512窗/epoch)
num_layers: 8
rollout_steps: 15
noise: 2.5e-4           # = 1.4x acc_std(1.6e-4), 与 2D 的噪声/信号比一致
target_correction: true
vel_from_displacement: true
grad_checkpoint: true
exp_name: main/01-pretrain
